<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#12161c;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:430px;background:#fffdf8;color:#20242c;border-radius:16px;padding:26px 26px 22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.6);font-feature-settings:"palt"}

.mid{display:flex;align-items:center;gap:16px;margin:22px 0}

.title{font-size:.74rem;color:#6b7280;letter-spacing:.1em;margin-bottom:4px}

.qr{width:92px;height:92px;flex-shrink:0;background:#fff;border:1px solid #ece7db;border-radius:8px;padding:5px}
.foot{border-top:1px solid #e7e2d6;padding-top:6px}
.row{display:flex;gap:12px;align-items:baseline;padding:9px 2px;border-bottom:1px solid #f0ece1;text-decoration:none;color:#20242c}
.row:last-child{border-bottom:none}
.row .k{font-size:.62rem;font-weight:700;color:#0a7a6b;letter-spacing:.06em;min-width:38px;flex-shrink:0}
.row .v{font-size:.86rem;word-break:break-all}
a.row:active{background:#f5f2ea}
.add{display:block;width:100%;margin-top:18px;padding:15px;border:none;border-radius:12px;background:#00c2a8;color:#05231f;font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.add:active{background:#0aa892}
